name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/codeanvil/UI/frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v4
      - run: pnpm install --frozen-lockfile
        working-directory: src/codeanvil/UI/frontend
      - run: pnpm build
        working-directory: src/codeanvil/UI/frontend
      - run: uv build

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install ${{ matrix.python-version }}
      - name: Run tool tests
        run: uv run --extra dev pytest tests/ -v
      - name: Run methodology tests
        run: uv run --extra dev pytest templates/tests/ -v
