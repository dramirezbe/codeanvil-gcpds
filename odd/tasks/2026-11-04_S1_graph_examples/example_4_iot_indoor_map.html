<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>S1 dependency graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/dist/vis-network.min.js"></script>
<style>
  body{margin:0;font-family:system-ui}
  #graph{width:100%;height:calc(100vh - 100px)}
  #meta{width:fit-content;margin:10px;background:#e5e7eb;border:1px solid #9ca3af;box-shadow:0 2px 8px rgba(0,0,0,.25);padding:8px 10px;border-radius:6px;font:12px monospace}
</style>
</head><body>
<pre id="meta"></pre>
<div id="graph"></div>
<script>
// === DATA: this is all the agent needs to change ===
const manifest = {
  "id": "019a51c2-0004-7000-8000-000000000004",
  "name": "Indoor IoT radio map, supplied ML model (illustrative)",
  "gt": {
    "strs": "GT/G0_StRS.md",
    "syrs": "GT/G0_SyRS.md"
  },
  "cycle": "01_indoor_rem"
};
const services = [
  {
    "id": "SVC-NODE",
    "label": "SVC-NODE\nNODE base\nHAL, scheduler",
    "modules": [
      {
        "id": "rssi_scan",
        "label": "rssi_scan\nVL-2",
        "color": "#378ADD"
      },
      {
        "id": "sample_buffer",
        "label": "sample_buffer\nVL-0",
        "color": "#888780"
      },
      {
        "id": "uplink",
        "label": "uplink\nVL-1",
        "color": "#1D9E75"
      },
      {
        "id": "health",
        "label": "health\nVL-0",
        "color": "#888780"
      }
    ]
  },
  {
    "id": "SVC-GATEWAY",
    "label": "SVC-GATEWAY\nGATEWAY base\nrouting, retry",
    "modules": [
      {
        "id": "node_registry",
        "label": "node_registry\nVL-0",
        "color": "#888780"
      },
      {
        "id": "batcher",
        "label": "batcher\nVL-0",
        "color": "#1D9E75"
      },
      {
        "id": "forwarder",
        "label": "forwarder\nVL-1",
        "color": "#1D9E75"
      },
      {
        "id": "health",
        "label": "health\nVL-0",
        "color": "#888780"
      }
    ]
  },
  {
    "id": "SVC-REM",
    "label": "SVC-REM\nREM base\nAPI, jobs",
    "modules": [
      {
        "id": "ingest",
        "label": "ingest\nVL-0",
        "color": "#1D9E75"
      },
      {
        "id": "rem_predictor",
        "label": "rem_predictor\nVL-1\nsupplied ML",
        "color": "#B7791F"
      },
      {
        "id": "map_store",
        "label": "map_store\nVL-0",
        "color": "#888780"
      },
      {
        "id": "map_api",
        "label": "map_api\nVL-1",
        "color": "#378ADD"
      },
      {
        "id": "health",
        "label": "health\nVL-0",
        "color": "#888780"
      }
    ]
  },
  {
    "id": "SVC-UI",
    "label": "SVC-UI\nUI base\nclient state",
    "modules": [
      {
        "id": "floor_plan",
        "label": "floor_plan\nVL-0",
        "color": "#378ADD"
      },
      {
        "id": "heatmap_view",
        "label": "heatmap_view\nVL-1",
        "color": "#378ADD"
      },
      {
        "id": "survey_control",
        "label": "survey_control\nVL-0",
        "color": "#378ADD"
      }
    ]
  }
];
const hardware = [
  {
    "id": "HWC-001",
    "label": "HWC-001\nESP32-S3",
    "to": [
      "SVC-NODE/rssi_scan"
    ]
  },
  {
    "id": "HWC-002",
    "label": "HWC-002\nRaspberry Pi 5",
    "to": [
      "SVC-GATEWAY/forwarder"
    ]
  }
];
const serviceContracts = [
  {
    "id": "rssi.v1",
    "from": [
      "SVC-NODE"
    ],
    "to": [
      "SVC-GATEWAY"
    ]
  },
  {
    "id": "node_config.v1",
    "from": [
      "SVC-GATEWAY"
    ],
    "to": [
      "SVC-NODE"
    ]
  },
  {
    "id": "batch.v1",
    "from": [
      "SVC-GATEWAY"
    ],
    "to": [
      "SVC-REM"
    ]
  },
  {
    "id": "map.v1",
    "from": [
      "SVC-REM"
    ],
    "to": [
      "SVC-UI"
    ]
  },
  {
    "id": "survey.v1",
    "from": [
      "SVC-UI"
    ],
    "to": [
      "SVC-REM"
    ]
  }
];
// ===================================================

const RED = '#D85A30', GREY = '#B4B2A9', BASE = '#7F77DD';
const box = (n) => ({ ...n, shape: 'box', font: { color: '#fff', size: 12 } });

document.title = `S1 dependency graph - ${manifest.name}`;
document.getElementById('meta').textContent =
  `id:    ${manifest.id}\nname:  ${manifest.name}\ncycle: ${manifest.cycle}\ngt:    ${manifest.gt.strs}, ${manifest.gt.syrs}`;

const graph = document.getElementById('graph');
if (typeof vis === 'undefined') {
  graph.textContent = 'vis-network could not load: this page needs network access.';
} else {
  // Each service is a spider: base at the center, modules on the spokes.
  // Module ids are prefixed by service, so two services may reuse a module name.
  const nodes = [
    ...services.map((s) => ({ id: s.id, label: s.label, color: BASE, shape: 'circle', font: { color: '#fff', size: 13 } })),
    ...services.flatMap((s) => s.modules.map((m) => box({ ...m, id: `${s.id}/${m.id}` }))),
    ...hardware.map((h) => box({ id: h.id, label: h.label, color: RED })),
    ...serviceContracts.map((c) => box({ id: `c:${c.id}`, label: c.id, color: RED })),
  ];
  const edges = [
    ...services.flatMap((s) => s.modules.map((m) => ({ from: s.id, to: `${s.id}/${m.id}`, color: { color: GREY } }))),
    ...hardware.flatMap((h) => h.to.map((to) => ({ from: h.id, to, arrows: 'to', dashes: true, color: { color: RED } }))),
    ...serviceContracts.flatMap((c) => [
      ...c.from.map((from) => ({ from, to: `c:${c.id}`, arrows: 'to', color: { color: RED } })),
      ...c.to.map((to) => ({ from: `c:${c.id}`, to, arrows: 'to', color: { color: RED } })),
    ]),
  ];
  new vis.Network(graph, { nodes, edges }, {
    layout: { randomSeed: 1 },
    physics: { solver: 'repulsion', repulsion: { nodeDistance: 180 } },
    nodes: { borderWidth: 0, shadow: { enabled: true, size: 6, color: 'rgba(0,0,0,0.1)' } },
    edges: { width: 1.5, smooth: { type: 'continuous' } },
    interaction: { hover: true, tooltipDelay: 100 },
  });
}
</script>
</body></html>
