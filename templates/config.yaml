# Single source of truth for the project scaffold.
# Consumed by src/codeanvil/init/create.py — keep paths repo-root-relative.

defaults:
  country: "America/Bogota"

skills:
  # Declaration order is the gate chain order. `prerequisite` is the report
  # id of the predecessor gate: the AGENTS.md table renders it and each
  # skill enforces it on load. null marks the entry point.
  G0_valid_req_and_GT:
    project_dir: ".agents/skills/G0_valid_req_and_GT"
    template_dir: "templates/skills/G0_valid_req_and_GT"
    prerequisite: null
  custody-chain:
    project_dir: ".agents/skills/custody-chain"
    template_dir: "templates/skills/custody-chain"
    prerequisite: "G0"
  G1_start_design:
    project_dir: ".agents/skills/G1_start_design"
    template_dir: "templates/skills/G1_start_design"
    prerequisite: "CC"

# Skill directory symlinks — agent runtimes that discover skills
# via a directory convention.
agent_skill_links:
  # Claude Code — native skill discovery
  ".claude/skills": "../.agents/skills"
  # GitHub Copilot — native skill discovery at .github/skills/
  ".github/skills": "../.agents/skills"
  # Antigravity — reads .agents/skills/ directly (no symlink needed,
  # it's the canonical path), but kept for completeness
  # OpenCode / Codex — no documented skill discovery, harmless symlinks
  ".opencode/skills": "../.agents/skills"
  ".codex/skills": "../.agents/skills"

# Instruction file symlinks — point agent-specific config files
# to the canonical AGENTS.md.
# Only include conventions that real tools actually read.
agent_config_links:
  # Claude Code — symlink, safest for all versions (pre/post v2.1.277)
  "CLAUDE.md": "AGENTS.md"

# Instruction pointer files — written as one-line references to AGENTS.md
# instead of symlinks, to avoid duplicate context loading in agents
# that read multiple instruction files additively.
agent_pointer_files:
  # Copilot reads AGENTS.md + CLAUDE.md + copilot-instructions.md
  # additively. A symlink would triple-load the same content.
  ".github/copilot-instructions.md": "See [AGENTS.md](../AGENTS.md) for project instructions."

  # REMOVED — no tool reads these:
  #   "COPILOT.md"          — fictional convention, nothing reads it
  #   ".gemini/AGENTS.md"   — Gemini CLI is dead; Antigravity reads
  #                           root AGENTS.md natively; Gemini read
  #                           GEMINI.md at root, not .gemini/AGENTS.md

  # OPTIONAL legacy fallback (uncomment if needed):
  #   "GEMINI.md": "See AGENTS.md for project instructions."

agents_template: "templates/AGENTS/TEMPLATE_AGENT.md"

# Skill that owns the locked GT reference templates and is referenced by
# the GT README (deterministic key, not derived from frontmatter).
g0_skill: "G0_valid_req_and_GT"

gt_reference_templates:
  - "G0_StRS.md"
  - "G0_SyRS.md"

# G1 ships its SRS reference template inside the G1 skill (the user authors
# GT/G1_SRS.md later — this is the locked structure copy).
g1_skill: "G1_start_design"
g1_reference_templates:
  - "G1_SRS.md"

# Repo-root paths inside SKILL.md / RULES.md become project-relative after
# copy. Order matters: applied in insertion order.
path_replacements:
  "templates/skills/": ".agents/skills/"
  "templates/GT/G0_StRS.md": ".agents/skills/G0_valid_req_and_GT/templates/G0_StRS.md"
  "templates/GT/G0_SyRS.md": ".agents/skills/G0_valid_req_and_GT/templates/G0_SyRS.md"
  "templates/GT/G1_SRS.md": ".agents/skills/G1_start_design/templates/G1_SRS.md"
  "(repository-root relative)": "(project-root relative)"
  ".provenance/": ".codeanvil/custody/"

# Never copy build artifacts or legacy empty scripts into a project.
copy_ignore:
  - "__pycache__"
  - "*.pyc"
  - "valid_structure_SRS.py"

# MCP servers — optional external tool integrations.
# Installed globally during `codeanvil init --mcp <name>`,
# wired into projects during `codeanvil create --mcp <name>`.
mcp_servers:
  marconi:
    repo: "https://github.com/yoelbassin/gr-mcp.git"
    install_dir: "mcp/marconi"
    command: "uv"
    args: ["--directory", "{install_path}", "run", "--extra", "mcp", "marconi-mcp"]
    env:
      MARCONI_WORKSPACE: "{project_dir}"
    skills_subdir: "skills"
    skill_prefix: "marconi"
    description: "LLM-driven GNU Radio — spectrum survey, receiver building, simulation"
    requires: ["uv"]
    system_packages: ["gnuradio"]
