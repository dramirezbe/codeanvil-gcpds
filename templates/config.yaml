# Single source of truth for the project scaffold.
# Consumed by src/codeanvil/init/create.py — keep paths repo-root-relative.

defaults:
  country: "America/Bogota"

skills:
  # Declaration order is the gate chain order. `prerequisite` is the report
  # id of the predecessor: the AGENTS.md table renders it and each skill
  # enforces it on load. null marks the entry point. RFD is not listed on
  # purpose: it can be raised from any stage, so its table cell renders "-".
  S0_normalise_build_package:
    project_dir: ".agents/skills/S0_normalise_build_package"
    prerequisite: null
  G0_valid_req_and_GT:
    project_dir: ".agents/skills/G0_valid_req_and_GT"
    prerequisite: "S0"
  S1_design_services:
    project_dir: ".agents/skills/S1_design_services"
    prerequisite: "G0"
  G1_design_review:
    project_dir: ".agents/skills/G1_design_review"
    prerequisite: "S1"
  S2_implement_services:
    project_dir: ".agents/skills/S2_implement_services"
    prerequisite: "G1"
  G2_adaptive_verification:
    project_dir: ".agents/skills/G2_adaptive_verification"
    prerequisite: "S2"

# Flow order of the chain reports, used by `codeanvil status` to print gates
# in order. Any other report id (RFD, old CC) follows alphabetically.
report_order: ["S0", "G0", "S1", "G1", "S2", "G2"]
# Stages finish in one pass: their PASS means "delivered", not a human verdict.
stage_reports: ["S0", "S1", "S2"]

# Files `codeanvil backup <stage>` copies before a skill overwrites them.
# Project-root-relative; {cycle} expands to the active cycle. The command is
# the single writer of .codeanvil/backups/ — skills never copy by hand.
backup_targets:
  S0: [".codeanvil/GT/StRS.md", ".codeanvil/GT/SyRS.md"]
  S1: [".codeanvil/design/SDD.md", ".codeanvil/design/dependency_graph.html"]
  S2: [".codeanvil/report/{cycle}/S2_artifacts/test_run.md"]
  G2: [".codeanvil/report/{cycle}/G2_artifacts/verified_prototype.md"]

# Global methodology runtime: one uv venv under ~/.codeanvil-config/<dir>/,
# shared by every project, built from templates/runtime/ plus user additions
# (`codeanvil runtime add`). Skill scripts run on it via `codeanvil python`.
# system_packages: OS-installed Python packages (e.g. gnuradio) bridged into
# the venv with a .pth file.
runtime:
  dir: "runtime"
  python: "3.12"
  # Shipped base; templates/runtime/pyproject.toml and uv.lock are generated
  # from it (a test keeps them in step). psutil: S2 telemetry collector.
  base: ["psutil", "pyyaml"]
  system_packages: []

# Skill directory symlinks — agent runtimes that discover skills
# via a directory convention.
agent_skill_links:
  # Claude Code — native skill discovery
  ".claude/skills": "../.agents/skills"
  # GitHub Copilot — native skill discovery at .github/skills/
  ".github/skills": "../.agents/skills"
  # Antigravity — reads .agents/skills/ directly (no symlink needed,
  # it's the canonical path), but kept for completeness
  # OpenCode / Codex — no documented skill discovery, harmless symlinks
  ".opencode/skills": "../.agents/skills"
  ".codex/skills": "../.agents/skills"

# Instruction file symlinks — point agent-specific config files
# to the canonical AGENTS.md.
# Only include conventions that real tools actually read.
agent_config_links:
  # Claude Code — symlink, safest for all versions (pre/post v2.1.277)
  "CLAUDE.md": "AGENTS.md"

# Instruction pointer files — written as one-line references to AGENTS.md
# instead of symlinks, to avoid duplicate context loading in agents
# that read multiple instruction files additively.
agent_pointer_files:
  # Copilot reads AGENTS.md + CLAUDE.md + copilot-instructions.md
  # additively. A symlink would triple-load the same content.
  ".github/copilot-instructions.md": "See [AGENTS.md](../AGENTS.md) for project instructions."

  # REMOVED — no tool reads these:
  #   "COPILOT.md"          — fictional convention, nothing reads it
  #   ".gemini/AGENTS.md"   — Gemini CLI is dead; Antigravity reads
  #                           root AGENTS.md natively; Gemini read
  #                           GEMINI.md at root, not .gemini/AGENTS.md

  # OPTIONAL legacy fallback (uncomment if needed):
  #   "GEMINI.md": "See AGENTS.md for project instructions."

agents_template: "templates/AGENTS/TEMPLATE_AGENT.md"

# Subagents shipped with every project: one shared body, one header per
# runtime. Only runtimes with documented project-scoped subagents are listed;
# Copilot and Pi get no file and G2 falls back to a fresh session.
# Codex (developers.openai.com/codex/subagents): name, description and
# developer_instructions are required; sandbox_mode in an agent file does not
# override the parent session, so read-only rests on the body's Never list.
subagents:
  vsil-verifier:
    body: "templates/agents/vsil-verifier.md"
    description: "V-SIL G2 verifier: runs the S2 test commands in a fresh, read-only context and returns a results table. Use only from the G2 skill."
    targets:
      claude:
        path: ".claude/agents/vsil-verifier.md"
        format: "markdown"
        frontmatter: {name: "vsil-verifier", tools: "Read, Grep, Glob, Bash"}
      opencode:
        path: ".opencode/agents/vsil-verifier.md"
        format: "markdown"
        frontmatter: {mode: "subagent", permission: {edit: "deny", webfetch: "deny", bash: "allow"}}
      codex:
        path: ".codex/agents/vsil-verifier.toml"
        format: "toml"
        fields: {name: "vsil-verifier"}

# Skills that each carry their own copy of the locked GT reference templates
# (self-contained skills), and the skill the GT README points to
# (deterministic keys, not derived from frontmatter).
s0_skill: "S0_normalise_build_package"
g0_skill: "G0_valid_req_and_GT"

gt_reference_templates:
  - "StRS.md"
  - "SyRS.md"

# Repo-root paths inside SKILL.md / RULES.md become project-relative after
# copy. Order matters: applied in insertion order.
path_replacements:
  "templates/skills/": ".agents/skills/"
  "templates/GT/StRS.md": ".agents/skills/G0_valid_req_and_GT/templates/StRS.md"
  "templates/GT/SyRS.md": ".agents/skills/G0_valid_req_and_GT/templates/SyRS.md"
  "(repository-root relative)": "(project-root relative)"

# Never copy build artifacts or legacy empty scripts into a project.
copy_ignore:
  - "__pycache__"
  - "*.pyc"
  - "valid_structure_SRS.py"

# Sandbox recipes for `codeanvil sandbox <agent>` — launch an agent inside
# a scaffolded project with only project-local settings (AGENTS.md,
# .agents/skills/, GT). Strategies:
#   native        — isolation via CLI flags only, no temp dir
#   xdg_redirect  — point XDG_CONFIG_HOME at an empty temp dir
#   env_redirect  — point env_var at a temp dir seeded with auth_files only
sandbox_agents:
  claude:
    binary: claude
    strategy: native
    args: ["--setting-sources", "project"]
  pi:
    binary: pi
    strategy: native
    args: ["--no-extensions", "--no-mcp", "--no-skills",
           "--no-prompt-templates", "--no-themes"]
    # Re-enabled with -e after --no-extensions: without pi-claude-bridge
    # Pi has no model access. Other extensions stay stripped.
    required_extensions: ["pi-claude-bridge"]
  opencode:
    binary: opencode
    strategy: xdg_redirect   # empty XDG_CONFIG_HOME, no auth needed
    env_var: XDG_CONFIG_HOME
    args: ["--standalone"]
  codex:
    binary: codex
    strategy: env_redirect   # CODEX_HOME override
    env_var: CODEX_HOME
    config_dir: "~/.codex"
    args: ["--no-daemon"]
    auth_files: ["installation_id"]

# MCP servers — optional external tool integrations.
# Installed globally during `codeanvil init --mcp <name>`,
# wired into projects during `codeanvil create --mcp <name>`.
mcp_servers:
  marconi:
    repo: "https://github.com/yoelbassin/gr-mcp.git"
    install_dir: "mcp/marconi"
    command: "uv"
    args: ["--directory", "{install_path}", "run", "--extra", "mcp", "marconi-mcp"]
    env:
      MARCONI_WORKSPACE: "{project_dir}"
    skills_subdir: "skills"
    skill_prefix: "marconi"
    description: "LLM-driven GNU Radio — spectrum survey, receiver building, simulation"
    requires: ["uv"]
    system_packages: ["gnuradio"]
