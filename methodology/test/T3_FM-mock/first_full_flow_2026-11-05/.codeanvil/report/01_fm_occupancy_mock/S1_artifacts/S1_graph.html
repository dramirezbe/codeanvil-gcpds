<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>S1 dependency graph</title>
<script src="../../../../.agents/skills/S1_design_services/assets/vis-network.min.js"></script>
<style>
  body{margin:0;font-family:system-ui}
  #graph{width:100%;height:calc(100vh - 100px)}
  #meta{width:fit-content;margin:10px;background:#e5e7eb;border:1px solid #9ca3af;box-shadow:0 2px 8px rgba(0,0,0,.25);padding:8px 10px;border-radius:6px;font:12px monospace}
</style>
</head><body>
<pre id="meta"></pre>
<div id="graph"></div>
<script>
// === DATA: this is all the agent needs to change ===
// manifest: the keys of .codeanvil/project.yaml, copied as they are.
const manifest = {
  id: '01a1ae49-3323-7000-9f49-b095be35b33d',
  name: 'FM Occupancy Mock',
  gt: { strs: 'GT/G0_StRS.md', syrs: 'GT/G0_SyRS.md' },
  cycle: '01_fm_occupancy_mock',
};
// services: one spider each. Module colors: one per functional layer, in this
// order: '#378ADD', '#1D9E75', '#888780', '#B7791F'.
//   { id: 'SVC-X', label: 'SVC-X\nX base\nresponsibility', modules: [
//     { id: 'module_id', label: 'module_id\nVL-0', color: '#378ADD' },
//   ] },
const services = [
  {
    id: 'SVC-001',
    label: 'SVC-001\nfm_edge base\nDSP + streaming',
    modules: [
      { id: 'capture', label: 'capture\nVL-0', color: '#378ADD' },
      { id: 'spectrum', label: 'spectrum\nVL-0', color: '#1D9E75' },
      { id: 'channels', label: 'channels\nVL-1', color: '#1D9E75' },
      { id: 'server', label: 'server\nVL-0', color: '#888780' },
    ],
  },
  {
    id: 'SVC-002',
    label: 'SVC-002\ndashboard base\nbrowser UI',
    modules: [
      { id: 'client', label: 'client\nVL-0', color: '#888780' },
      { id: 'waterfall', label: 'waterfall\nVL-0', color: '#1D9E75' },
      { id: 'views', label: 'views\nVL-1', color: '#888780' },
    ],
  },
];
// hardware: one entry per COTS device, attached to the modules that touch it.
//   { id: 'HWC-001', label: 'HWC-001\nDevice', to: ['SVC-X/module_id'] },
// In mock-only mode no module has hw_dependency: true, so `to` arrays are empty.
// The devices are shown for completeness per §0.1.
const hardware = [
  { id: 'HW-001', label: 'HW-001\nRTL-SDR V4', to: [] },
  { id: 'HW-002', label: 'HW-002\nDipole antenna', to: [] },
  { id: 'HW-003', label: 'HW-003\nRaspberry Pi 4', to: [] },
  { id: 'HW-004', label: 'HW-004\nBrowser PC', to: [] },
];
// serviceContracts: one entry per versioned contract.
//   { id: 'name.v1', from: ['SVC-X'], to: ['SVC-Y', 'SVC-Z'] },
const serviceContracts = [
  { id: 'update.v1', from: ['SVC-001'], to: ['SVC-002'] },
];
// ===================================================

const RED = '#D85A30', GREY = '#B4B2A9', BASE = '#7F77DD';
const box = (n) => ({ ...n, shape: 'box', font: { color: '#fff', size: 12 } });

document.title = `S1 dependency graph - ${manifest.name}`;
document.getElementById('meta').textContent =
  `id:    ${manifest.id}\nname:  ${manifest.name}\ncycle: ${manifest.cycle}\ngt:    ${manifest.gt.strs}, ${manifest.gt.syrs}`;

const graph = document.getElementById('graph');
if (typeof vis === 'undefined') {
  graph.textContent = 'vis-network could not load: keep this page inside its project, next to the .agents folder.';
} else {
  // Each service is a spider: base at the center, modules on the spokes.
  // Module ids are prefixed by service, so two services may reuse a module name.
  const nodes = [
    ...services.map((s) => ({ id: s.id, label: s.label, color: BASE, shape: 'circle', font: { color: '#fff', size: 13 } })),
    ...services.flatMap((s) => s.modules.map((m) => box({ ...m, id: `${s.id}/${m.id}` }))),
    ...hardware.map((h) => box({ id: h.id, label: h.label, color: RED })),
    ...serviceContracts.map((c) => box({ id: `c:${c.id}`, label: c.id, color: RED })),
  ];
  const edges = [
    ...services.flatMap((s) => s.modules.map((m) => ({ from: s.id, to: `${s.id}/${m.id}`, color: { color: GREY } }))),
    ...hardware.flatMap((h) => h.to.map((to) => ({ from: h.id, to, arrows: 'to', dashes: true, color: { color: RED } }))),
    ...serviceContracts.flatMap((c) => [
      ...c.from.map((from) => ({ from, to: `c:${c.id}`, arrows: 'to', color: { color: RED } })),
      ...c.to.map((to) => ({ from: `c:${c.id}`, to, arrows: 'to', color: { color: RED } })),
    ]),
  ];
  new vis.Network(graph, { nodes, edges }, {
    layout: { randomSeed: 1 },
    physics: { solver: 'repulsion', repulsion: { nodeDistance: 180 } },
    nodes: { borderWidth: 0, shadow: { enabled: true, size: 6, color: 'rgba(0,0,0,0.1)' } },
    edges: { width: 1.5, smooth: { type: 'continuous' } },
    interaction: { hover: true, tooltipDelay: 100 },
  });
}
</script>
</body></html>
