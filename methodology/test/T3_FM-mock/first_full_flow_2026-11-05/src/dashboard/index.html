<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FMSWD — FM Spectrum, Waterfall and Channel Detection</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 16px; }
    h1 { font-size: 1.2rem; margin-bottom: 12px; color: #9ba4b5; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; max-width: 960px; margin: 0 auto; }
    .panel { background: #16213e; border-radius: 8px; padding: 12px; }
    .panel h2 { font-size: 0.9rem; color: #7b8794; margin-bottom: 8px; }
    canvas { width: 100%; height: 200px; display: block; background: #0f3460; border-radius: 4px; }
    #spectrum-canvas { height: 180px; }
    #waterfall-canvas { height: 200px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 4px 8px; text-align: left; border-bottom: 1px solid #1a1a3e; }
    th { color: #7b8794; }
    .occupied { color: #4ecca3; font-weight: bold; }
    .free { color: #6b7280; }
    #status { font-size: 0.8rem; color: #7b8794; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>FMSWD — FM Spectrum, Waterfall and Channel Detection</h1>
  <div class="grid">
    <div class="panel">
      <h2>Spectrum</h2>
      <canvas id="spectrum-canvas"></canvas>
    </div>
    <div class="panel">
      <h2>Waterfall (last 60 s)</h2>
      <canvas id="waterfall-canvas"></canvas>
    </div>
    <div class="panel">
      <h2>Channels</h2>
      <table id="channel-table">
        <thead><tr><th>Channel</th><th>Frequency (MHz)</th><th>Status</th><th>Occupancy</th></tr></thead>
        <tbody id="channel-body"></tbody>
      </table>
    </div>
  </div>
  <div id="status">Connecting...</div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
