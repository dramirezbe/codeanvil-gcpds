[project]
name = "demo-counter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
demo_counter = "demo_counter.main:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_counter"]

[tool.pytest.ini_options]
testpaths = ["verification"]
pythonpath = ["src", "."]
markers = ["vl0: deterministic floor", "vl1: synthetic sequence"]
