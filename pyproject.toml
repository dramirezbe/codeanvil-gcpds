[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeanvil"
version = "0.1.2"
requires-python = ">=3.10"
description = "V-SIL methodology harness — agent-agnostic project scaffolding and gate validation"
license = "Apache-2.0"
dependencies = [
    "beaupy>=4.0.1",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
codeanvil = "codeanvil.CLI.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codeanvil"]

[tool.hatch.build.targets.wheel.force-include]
"templates/skills" = "codeanvil/templates/skills"
"templates/GT/G0_StRS.md" = "codeanvil/templates/GT/G0_StRS.md"
"templates/GT/G0_SyRS.md" = "codeanvil/templates/GT/G0_SyRS.md"
"templates/GT/G1_SRS.md" = "codeanvil/templates/GT/G1_SRS.md"
"templates/GT/README.md.template" = "codeanvil/templates/GT/README.md.template"
"templates/config.yaml" = "codeanvil/templates/config.yaml"
"templates/AGENTS" = "codeanvil/templates/AGENTS"
