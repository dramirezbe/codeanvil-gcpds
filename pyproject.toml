[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeanvil"
version = "0.1.0"
requires-python = ">=3.10"
description = "V-SIL methodology harness — agent-agnostic project scaffolding and gate validation"
license = "Apache-2.0"
dependencies = ["pyyaml"]

[project.scripts]
codeanvil = "codeanvil.CLI.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codeanvil"]

[tool.hatch.build.targets.wheel.force-include]
"templates/skills" = "codeanvil/templates/skills"
"templates/GT/G0_SRS.md" = "codeanvil/templates/GT/G0_SRS.md"
"templates/GT/G0_HCS.md" = "codeanvil/templates/GT/G0_HCS.md"
"templates/config.yaml" = "codeanvil/templates/config.yaml"
"templates/AGENTS" = "codeanvil/templates/AGENTS"

[tool.hatch.build.targets.sdist.force-include]
"templates/skills" = "codeanvil/templates/skills"
"templates/GT/G0_SRS.md" = "codeanvil/templates/GT/G0_SRS.md"
"templates/GT/G0_HCS.md" = "codeanvil/templates/GT/G0_HCS.md"
"templates/config.yaml" = "codeanvil/templates/config.yaml"
"templates/AGENTS" = "codeanvil/templates/AGENTS"
