[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeanvil"
version = "0.8.3"
requires-python = ">=3.10"
description = "Agent-agnostic harness that takes a hardware spec to a verified prototype — any AI coding agent, any OS"
license = "Apache-2.0"
dependencies = [
    "beaupy>=4.0.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psutil",
    "pyyaml",
    "uvicorn[standard]>=0.30",
    "watchdog>=5",
]

[project.optional-dependencies]
dev = ["pytest", "tomli; python_version < '3.11'"]

[project.scripts]
codeanvil = "codeanvil.CLI.main:main"

[tool.pytest.ini_options]
testpaths = ["tests", "templates/tests"]

[tool.hatch.build]
exclude = ["**/node_modules/**", "**/*.tsbuildinfo"]

[tool.hatch.build.targets.wheel]
packages = ["src/codeanvil"]
exclude = ["src/codeanvil/UI/frontend/**"]

[tool.hatch.build.hooks.custom]
path = "src/codeanvil/UI/build_hook.py"

[tool.hatch.build.targets.wheel.force-include]
"src/codeanvil/UI/frontend/dist" = "codeanvil/UI/frontend/dist"
"templates/skills" = "codeanvil/templates/skills"
"templates/GT/StRS.md" = "codeanvil/templates/GT/StRS.md"
"templates/GT/SyRS.md" = "codeanvil/templates/GT/SyRS.md"
"templates/GT/README.md.template" = "codeanvil/templates/GT/README.md.template"
"templates/config.yaml" = "codeanvil/templates/config.yaml"
"templates/AGENTS" = "codeanvil/templates/AGENTS"
"templates/agents" = "codeanvil/templates/agents"
"templates/runtime" = "codeanvil/templates/runtime"
"templates/mcp" = "codeanvil/templates/mcp"

[tool.hatch.build.targets.sdist.force-include]
"src/codeanvil/UI/frontend/dist" = "src/codeanvil/UI/frontend/dist"
