[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeanvil"
version = "0.1.0"
requires-python = ">=3.10"
description = "V-SIL methodology harness — agent-agnostic project scaffolding and gate validation"
license = "Apache-2.0"

[project.scripts]
codeanvil = "codeanvil.CLI.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codeanvil"]
